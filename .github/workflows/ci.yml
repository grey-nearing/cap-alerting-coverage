name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-core:
    name: Core Tier-1 & CLI (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core package and dev dependencies (no tier2 extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check src tests scripts

      - name: Run unit, synthetic Tier-1 integration, and clean-room privacy tests
        run: pytest -m "not zenodo" -v

      - name: Verify all numbered pipeline script --help entrypoints without [tier2]
        run: |
          for s in scripts/*.py; do
            echo "Checking $s --help"
            python "$s" --help >/dev/null
          done

  test-tier2-and-wheel:
    name: Tier-2 Extra & Non-Editable Wheel Install
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install with [dev,tier2] and run offline test suite
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,tier2]"
          pytest -m "not zenodo" -v

      - name: Verify non-editable wheel install outside repository checkout
        run: |
          python -m venv /tmp/wheel_venv
          /tmp/wheel_venv/bin/pip install --upgrade pip
          /tmp/wheel_venv/bin/pip install ".[tier2]"
          cd /tmp
          /tmp/wheel_venv/bin/cap-gap --version
          /tmp/wheel_venv/bin/cap-alerting-coverage --help >/dev/null
          /tmp/wheel_venv/bin/python -c '
          from cap_alerting_coverage.config import ProjectPaths
          from cap_alerting_coverage.ingestion.db import init_sql_schema
          paths = ProjectPaths.from_env()
          assert paths.supplementary_data_1_csv.is_file(), paths.supplementary_data_1_csv
          assert paths.countries_geojson.is_file(), paths.countries_geojson
          init_sql_schema("sqlite:///:memory:")
          print("Wheel package data & SQL DDL verified cleanly from /tmp.")
          '
