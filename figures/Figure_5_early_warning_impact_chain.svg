<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 42 1200 614" width="1200" height="614">
  <defs>
    <style type="text/css">
      .node-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
      .node-text-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .polarity-pos { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #0284c7; }
      .polarity-neg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #e11d48; }
      .legend-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: bold; fill: #0f172a; }
      .legend-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9.5px; fill: #334155; }
      .scope-tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: bold; fill: #e11d48; }
    </style>

    <!-- Arrow Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#cbd5e1"/>
    </marker>

    <!-- Card Shadow -->
    <filter id="card-shadow" x="-6%" y="-6%" width="112%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="42" width="1200" height="614" fill="#ffffff"/>

  <!-- ========================================================================= -->
  <!-- RED DASHED SCOPE BOUNDARY (FORECAST-TO-ALERT GENERATION SUBSYSTEM)        -->
  <!-- Encloses Flood forecast, Accuracy, Severity, 3 Authorities nodes, and     -->
  <!-- Flood alert; excludes dissemination reach, alert receipt, and downstream. -->
  <!-- ========================================================================= -->
  <g>
    <path d="M 130,99 L 284,99 Q 304,99 304,119 L 304,328 Q 304,352 326,352 L 434,352 Q 454,352 454,372 L 454,432 Q 454,452 434,452 L 386,452 Q 372,452 368,470 L 346,574 Q 342,592 322,592 L 40,592 Q 20,592 20,572 L 20,222 Q 20,202 40,202 L 90,202 Q 110,202 110,182 L 110,119 Q 110,99 130,99 Z"
          fill="#fff1f2" fill-opacity="0.48" stroke="#f43f5e" stroke-width="2.2" stroke-dasharray="7,4"/>
    <g transform="translate(139, 88)">
      <rect x="0" y="0" width="136" height="22" rx="4" fill="#ffffff" stroke="#fecdd3" stroke-width="1.2" filter="url(#card-shadow)"/>
      <circle cx="11" cy="11" r="4" fill="#e11d48"/>
      <text x="21" y="14.5" class="scope-tag">Scope of this study</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- CAUSAL RELATIONSHIP ARCS & POLARITIES (+ / −)                             -->
  <!-- ========================================================================= -->

  <!-- Flood forecast -> Authorities are willing to issue alert -->
  <path d="M 120, 350 C 135, 350 145, 365 155, 375" fill="none" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <!-- Severity of forecasted flood -> Authorities are willing to issue alert -->
  <path d="M 160, 245 C 185, 245 200, 280 205, 350" fill="none" stroke="#7dd3fc" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text x="212" y="344" class="polarity-pos">+</text>

  <!-- Accuracy of flood forecast -> Authorities are willing to issue alert -->
  <path d="M 230, 160 C 255, 175 260, 250 240, 350" fill="none" stroke="#7dd3fc" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text x="249" y="344" class="polarity-pos">+</text>

  <!-- Long Sweeping Top Arc: Accuracy of flood forecast -> People are willing to take action -->
  <path d="M 270, 125 C 380, 20 600, 20 705, 175" fill="none" stroke="#7dd3fc" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text x="698" y="160" class="polarity-pos">+</text>

  <!-- Authorities are willing to issue alert -> Flood alert -->
  <path d="M 290, 375 C 305, 375 315, 385 325, 395" fill="none" stroke="#7dd3fc" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text x="321" y="385" class="polarity-pos">+</text>

  <!-- Authorities have capacity to issue alert -> Flood alert -->
  <path d="M 285, 475 C 305, 475 325, 455 340, 435" fill="none" stroke="#7dd3fc" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text x="323" y="454" class="polarity-pos">+</text>

  <!-- Authorities know how to issue alert -> Flood alert -->
  <path d="M 275, 555 C 315, 555 345, 510 355, 440" fill="none" stroke="#7dd3fc" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text x="342" y="468" class="polarity-pos">+</text>

  <!-- Reach of alert dissemination channels -> Flood alerts received -->
  <path d="M 445, 275 C 475, 275 490, 305 500, 360" fill="none" stroke="#7dd3fc" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text x="504" y="352" class="polarity-pos">+</text>

  <!-- Flood alert -> Flood alerts received -->
  <path d="M 410, 410 C 435, 410 460, 410 475, 410" fill="none" stroke="#7dd3fc" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text x="462" y="401" class="polarity-pos">+</text>

  <!-- Flood alerts received -> People are willing to take action -->
  <path d="M 545, 365 C 570, 270 650, 215 695, 205" fill="none" stroke="#7dd3fc" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text x="676" y="198" class="polarity-pos">+</text>

  <!-- Flood alerts received -> People know how to take action -->
  <path d="M 585, 385 C 625, 375 660, 380 690, 395" fill="none" stroke="#7dd3fc" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text x="676" y="381" class="polarity-pos">+</text>

  <!-- Utility of flood alert content -> People know how to take action -->
  <path d="M 640, 520 C 675, 520 710, 480 730, 435" fill="none" stroke="#7dd3fc" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text x="716" y="452" class="polarity-pos">+</text>

  <!-- Timeliness of flood alert -> People have capacity to take action -->
  <path d="M 525, 620 C 585, 620 635, 620 670, 600" fill="none" stroke="#7dd3fc" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text x="652" y="601" class="polarity-pos">+</text>

  <!-- People are willing to take action -> Protective early actions -->
  <path d="M 795, 230 C 850, 270 880, 320 890, 360" fill="none" stroke="#7dd3fc" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text x="895" y="352" class="polarity-pos">+</text>

  <!-- People know how to take action -> Protective early actions -->
  <path d="M 800, 405 C 830, 405 850, 405 865, 405" fill="none" stroke="#7dd3fc" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text x="850" y="397" class="polarity-pos">+</text>

  <!-- People have capacity to take action -> Protective early actions -->
  <path d="M 800, 580 C 855, 570 885, 510 895, 445" fill="none" stroke="#7dd3fc" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text x="879" y="460" class="polarity-pos">+</text>

  <!-- Experience of flooding -> People are willing to take action -->
  <path d="M 900, 125 C 850, 115 790, 125 765, 170" fill="none" stroke="#7dd3fc" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text x="774" y="158" class="polarity-pos">+</text>

  <!-- Experience of flooding -> People know how to take action -->
  <path d="M 945, 155 C 930, 240 850, 340 790, 385" fill="none" stroke="#7dd3fc" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text x="794" y="368" class="polarity-pos">+</text>

  <!-- Protective early actions -> Flood impacts (NEGATIVE CAUSAL LINK) -->
  <path d="M 990, 405 C 1030, 405 1060, 415 1085, 425" fill="none" stroke="#fda4af" stroke-width="2.6" marker-end="url(#arrow-red)"/>
  <text x="1064" y="408" class="polarity-neg">−</text>

  <!-- Flood impacts -> Experience of flooding (FEEDBACK LOOP) -->
  <path d="M 1135, 410 C 1175, 330 1140, 180 1025, 140" fill="none" stroke="#7dd3fc" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text x="1044" y="138" class="polarity-pos">+</text>


  <!-- ========================================================================= -->
  <!-- NODES / PILLS (Grouped & Styled)                                          -->
  <!-- ========================================================================= -->

  <!-- Node: Flood forecast -->
  <g transform="translate(40, 330)">
    <rect x="0" y="0" width="115" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" filter="url(#card-shadow)"/>
    <text x="57.5" y="23" class="node-text">Flood forecast</text>
  </g>

  <!-- Node: Severity of forecasted flood -->
  <g transform="translate(50, 225)">
    <rect x="0" y="0" width="145" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" filter="url(#card-shadow)"/>
    <text x="72.5" y="18" class="node-text">Severity of</text>
    <text x="72.5" y="32" class="node-text">forecasted flood</text>
  </g>

  <!-- Node: Accuracy of flood forecast -->
  <g transform="translate(135, 120)">
    <rect x="0" y="0" width="145" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" filter="url(#card-shadow)"/>
    <text x="72.5" y="18" class="node-text">Accuracy of</text>
    <text x="72.5" y="32" class="node-text">flood forecast</text>
  </g>

  <!-- Node: Authorities are willing to issue alert -->
  <g transform="translate(155, 360)">
    <rect x="0" y="0" width="155" height="44" rx="6" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.4" filter="url(#card-shadow)"/>
    <text x="77.5" y="18" class="node-text">Authorities are willing</text>
    <text x="77.5" y="33" class="node-text">to issue alert</text>
  </g>

  <!-- Node: Authorities have capacity to issue alert -->
  <g transform="translate(150, 460)">
    <rect x="0" y="0" width="160" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" filter="url(#card-shadow)"/>
    <text x="80" y="18" class="node-text">Authorities have capacity</text>
    <text x="80" y="33" class="node-text">to issue alert</text>
  </g>

  <!-- Node: Authorities know how to issue alert -->
  <g transform="translate(150, 540)">
    <rect x="0" y="0" width="160" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" filter="url(#card-shadow)"/>
    <text x="80" y="18" class="node-text">Authorities know how</text>
    <text x="80" y="33" class="node-text">to issue alert</text>
  </g>

  <!-- Node: Flood alert -->
  <g transform="translate(335, 390)">
    <rect x="0" y="0" width="105" height="42" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.8" filter="url(#card-shadow)"/>
    <text x="52.5" y="26" class="node-text-bold" fill="#0369a1">Flood alert</text>
  </g>

  <!-- Node: Reach of alert dissemination channels -->
  <g transform="translate(325, 235)">
    <rect x="0" y="0" width="165" height="44" rx="6" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.3" filter="url(#card-shadow)"/>
    <text x="82.5" y="18" class="node-text">Reach of alert</text>
    <text x="82.5" y="33" class="node-text">dissemination channels</text>
  </g>

  <!-- Node: Flood alerts received -->
  <g transform="translate(485, 385)">
    <rect x="0" y="0" width="135" height="44" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8" filter="url(#card-shadow)"/>
    <text x="67.5" y="27" class="node-text-bold" fill="#0369a1">Flood alerts received</text>
  </g>

  <!-- Node: Utility of flood alert content -->
  <g transform="translate(530, 500)">
    <rect x="0" y="0" width="145" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" filter="url(#card-shadow)"/>
    <text x="72.5" y="18" class="node-text">Utility of flood</text>
    <text x="72.5" y="32" class="node-text">alert content</text>
  </g>

  <!-- Node: Timeliness of flood alert -->
  <g transform="translate(435, 600)">
    <rect x="0" y="0" width="140" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" filter="url(#card-shadow)"/>
    <text x="70" y="23" class="node-text">Timeliness of flood alert</text>
  </g>

  <!-- Node: People are willing to take action -->
  <g transform="translate(685, 175)">
    <rect x="0" y="0" width="145" height="44" rx="6" fill="#fefce8" stroke="#fde047" stroke-width="1.4" filter="url(#card-shadow)"/>
    <text x="72.5" y="18" class="node-text">People are willing</text>
    <text x="72.5" y="33" class="node-text">to take action</text>
  </g>

  <!-- Node: People know how to take action -->
  <g transform="translate(690, 385)">
    <rect x="0" y="0" width="145" height="44" rx="6" fill="#fefce8" stroke="#fde047" stroke-width="1.4" filter="url(#card-shadow)"/>
    <text x="72.5" y="18" class="node-text">People know how</text>
    <text x="72.5" y="33" class="node-text">to take action</text>
  </g>

  <!-- Node: People have capacity to take action -->
  <g transform="translate(670, 560)">
    <rect x="0" y="0" width="145" height="44" rx="6" fill="#fefce8" stroke="#fde047" stroke-width="1.4" filter="url(#card-shadow)"/>
    <text x="72.5" y="18" class="node-text">People have capacity</text>
    <text x="72.5" y="33" class="node-text">to take action</text>
  </g>

  <!-- Node: Experience of flooding -->
  <g transform="translate(900, 115)">
    <rect x="0" y="0" width="140" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" filter="url(#card-shadow)"/>
    <text x="70" y="24" class="node-text">Experience of flooding</text>
  </g>

  <!-- Node: Protective early actions -->
  <g transform="translate(875, 385)">
    <rect x="0" y="0" width="145" height="44" rx="8" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.8" filter="url(#card-shadow)"/>
    <text x="72.5" y="27" class="node-text-bold" fill="#15803d">Protective early actions</text>
  </g>

  <!-- Node: Flood impacts -->
  <g transform="translate(1075, 410)">
    <rect x="0" y="0" width="105" height="42" rx="8" fill="#fff1f2" stroke="#fb7185" stroke-width="1.8" filter="url(#card-shadow)"/>
    <text x="52.5" y="26" class="node-text-bold" fill="#be123c">Flood impacts</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LEGEND                                                                    -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 600)">
    <rect x="0" y="0" width="200" height="45" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#card-shadow)"/>
    <text x="12" y="16" class="legend-title">Legend</text>
    
    <line x1="12" y1="26" x2="32" y2="26" stroke="#7dd3fc" stroke-width="2.5"/>
    <text x="38" y="29" class="legend-text">Adds to / same direction (+)</text>
    
    <line x1="12" y1="38" x2="32" y2="38" stroke="#fda4af" stroke-width="2.5"/>
    <text x="38" y="41" class="legend-text">Subtracts from / opposite direction (−)</text>
  </g>

</svg>
