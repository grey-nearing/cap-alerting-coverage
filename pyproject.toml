[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cap-alerting-coverage"
version = "1.0.0"
description = "Reproducible evaluation pipeline for global Common Alerting Protocol (CAP) flood alerting coverage and global flood forecast models (2021-2025)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "data_inputs/LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Justin Ginnetti" },
  { name = "Grey Nearing" },
]
keywords = [
  "flood forecasting",
  "early warning systems",
  "common alerting protocol",
  "hydrology",
  "disaster risk reduction",
  "reproducibility",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "matplotlib>=3.8",
  "pyarrow>=15.0",
  "geopandas>=1.0",
  "shapely>=2.0",
  "requests>=2.31",
]

[project.optional-dependencies]
tier2 = [
  "pyogrio>=0.8",
  "fsspec>=2024.2",
  "zstandard>=0.22",
  "python-dateutil>=2.8",
  "defusedxml>=0.7.1",
  "sqlalchemy>=2.0",
]
cloud = [
  "google-cloud-spanner>=3.40",
  "google-cloud-storage>=2.16",
  "google-cloud-aiplatform>=1.60",
  "psycopg2-binary>=2.9",
  "pg8000>=1.30",
]
notebooks = [
  "nbformat>=5.10",
  "nbclient>=0.10",
  "nbconvert>=7.16",
  "ipykernel>=6.29",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
cap-gap = "cap_alerting_coverage.cli:main"
cap-alerting-coverage = "cap_alerting_coverage.cli:main"

[project.urls]
Homepage = "https://github.com/grey-nearing/cap-alerting-coverage"
Repository = "https://github.com/grey-nearing/cap-alerting-coverage"
Issues = "https://github.com/grey-nearing/cap-alerting-coverage/issues"

[tool.setuptools]
packages = [
  "cap_alerting_coverage",
  "cap_alerting_coverage.ingestion",
  "cap_alerting_coverage.pipeline",
  "cap_alerting_coverage._data_inputs",
]

[tool.setuptools.package-dir]
"" = "src"
"cap_alerting_coverage._data_inputs" = "data_inputs"

[tool.setuptools.package-data]
"cap_alerting_coverage.ingestion" = ["schema.sql"]
"cap_alerting_coverage._data_inputs" = ["*.csv", "*.txt", "*.geojson", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
markers = [
  "zenodo: integration tests requiring the staged Zenodo archive via CAP_GAP_ZENODO_DIR",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
